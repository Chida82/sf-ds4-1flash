# sfctl service config for sf-ds4-1flash (read by sfctl/sfctl; see sfctl/README.md).
# Relative paths resolve against the serve worktree, the agent's working
# directory. @HOME@ becomes ~/.sf/ds4-1flash when the agent is written.

# Service port on 127.0.0.1 (sfctl ports: 8909-8912, one per child).
SF_PORT=8910
# The server binary, built in serve by `make <name>`.
SF_SERVER=sf-ds4-1flash-server
# component:path pairs: ./download.sh <component> links <path> when it is missing.
SF_COMPONENTS="main:deepseek-v4.1-flash.gguf vision:gguf/DeepSeek-V4.1-Flash-Vision.gguf"
# Server options after --port. No option may contain a space.
SF_ARGS='--vision gguf/DeepSeek-V4.1-Flash-Vision.gguf --ctx 262144 --tokens 65536 --ssd-streaming --ssd-streaming-cache-experts 82GB --kv-disk-dir @HOME@/kv --kv-disk-space-mb 32768 --steering-profile-on-request com-steering/profiles/sf-ds4-1flash-candor.sfsteer --boost-on-max-effort'
